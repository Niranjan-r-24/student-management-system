<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Management System</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #eaf1ff; background: #0b1120; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 10% 0%, #213c80 0, transparent 36rem), #0b1120; }
    header { padding: 28px clamp(20px, 6vw, 78px); display: flex; justify-content: space-between; gap: 20px; align-items: center; }
    .brand { display: flex; gap: 13px; align-items: center; font-weight: 800; font-size: 1.16rem; }
    .logo { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: #77ddff; color: #071221; font-size: 1.3rem; }
    .docs { color: #b9caf0; text-decoration: none; font-weight: 650; }
    main { max-width: 1240px; margin: 0 auto; padding: 22px clamp(20px, 6vw, 78px) 70px; }
    .hero { display: flex; justify-content: space-between; gap: 30px; align-items: end; margin: 28px 0 34px; }
    h1 { margin: 0; font-size: clamp(2.2rem, 5vw, 4.25rem); letter-spacing: -.055em; line-height: 1; }
    .hero p { color: #aebdd7; max-width: 540px; line-height: 1.6; margin: 14px 0 0; }
    button { cursor: pointer; border: 0; font: inherit; font-weight: 700; }
    .primary { padding: 12px 16px; border-radius: 10px; background: #77ddff; color: #06111f; }
    .primary:hover { background: #b7edff; }
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .metric, .panel { border: 1px solid #2a3a5c; background: rgba(18, 29, 52, .82); border-radius: 16px; box-shadow: 0 16px 45px rgba(0, 0, 0, .12); }
    .metric { padding: 20px; }
    .metric span { display: block; color: #9fb0cc; font-size: .83rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }
    .metric strong { display: block; margin-top: 9px; font-size: 2rem; }
    .layout { display: grid; grid-template-columns: minmax(290px, .8fr) 1.6fr; gap: 18px; margin-top: 18px; }
    .panel { padding: 24px; }
    h2 { margin: 0 0 18px; font-size: 1.2rem; }
    form { display: grid; gap: 13px; }
    label { display: grid; gap: 7px; color: #c3d0e7; font-size: .87rem; font-weight: 650; }
    input { width: 100%; border: 1px solid #34486f; border-radius: 9px; padding: 11px 12px; background: #0c162a; color: #edf3ff; font: inherit; }
    input:focus { outline: 2px solid #77ddff; outline-offset: 1px; }
    .form-actions { display: flex; gap: 10px; margin-top: 5px; }
    .secondary { padding: 11px 14px; border-radius: 9px; color: #c3d0e7; background: #263653; }
    .notice { min-height: 22px; margin: 14px 0 0; color: #a7f3d0; font-weight: 650; font-size: .9rem; }
    .notice.error { color: #ffb4b4; }
    .table-tools { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 15px; }
    .search { max-width: 280px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 560px; }
    th, td { padding: 13px 10px; border-bottom: 1px solid #2a3a5c; text-align: left; }
    th { color: #9fb0cc; font-size: .76rem; letter-spacing: .07em; text-transform: uppercase; }
    td { color: #dbe7fb; }
    .row-actions { display: flex; gap: 7px; }
    .small { padding: 7px 9px; border-radius: 7px; color: #dbe7fb; background: #263653; font-size: .78rem; }
    .danger { color: #ffc3c3; background: #4a2837; }
    .empty { color: #9fb0cc; padding: 28px 0 10px; text-align: center; }
    @media (max-width: 850px) { .metrics { grid-template-columns: repeat(2, 1fr); } .layout { grid-template-columns: 1fr; } .hero { align-items: start; flex-direction: column; } }
    @media (max-width: 480px) { header { padding-top: 20px; } .metrics { grid-template-columns: 1fr 1fr; } .metric { padding: 15px; } }
  </style>
</head>
<body>
  <header>
    <div class="brand"><div class="logo">🎓</div>Student Management System</div>
    <a class="docs" href="/docs" target="_blank" rel="noreferrer">API Docs ↗</a>
  </header>
  <main>
    <section class="hero">
      <div><h1>Your students,<br>in one place.</h1><p>Track student records, courses, and contact details from a simple dashboard.</p></div>
      <button class="primary" type="button" onclick="resetForm()">+ Add student</button>
    </section>
    <section class="metrics">
      <div class="metric"><span>Total students</span><strong id="total">—</strong></div>
      <div class="metric"><span>AI students</span><strong id="ai">—</strong></div>
      <div class="metric"><span>Data Science</span><strong id="ds">—</strong></div>
      <div class="metric"><span>Average age</span><strong id="average">—</strong></div>
    </section>
    <section class="layout">
      <article class="panel">
        <h2 id="form-title">Add a student</h2>
        <form id="student-form">
          <label>Student ID<input id="id" type="number" min="1" required></label>
          <label>Full name<input id="name" minlength="1" required></label>
          <label>Age<input id="age" type="number" min="18" required></label>
          <label>Course<input id="course" minlength="1" required></label>
          <label>Email address<input id="email" type="email" required></label>
          <div class="form-actions"><button class="primary" id="submit" type="submit">Save student</button><button class="secondary" type="button" onclick="resetForm()">Clear</button></div>
        </form>
        <p id="notice" class="notice" role="status"></p>
      </article>
      <article class="panel">
        <div class="table-tools"><h2>Student directory</h2><input id="filter" class="search" placeholder="Search by name, course or email" oninput="renderTable()"></div>
        <div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Age</th><th>Course</th><th>Email</th><th>Actions</th></tr></thead><tbody id="students"></tbody></table></div>
      </article>
    </section>
  </main>
  <script>
    let students = [];
    let editingId = null;
    const fields = ["id", "name", "age", "course", "email"];
    const notice = document.getElementById("notice");
    const escapeHtml = (value) => String(value).replace(/[&<>'"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char]));
    function showNotice(message, error = false) { notice.textContent = message; notice.className = `notice${error ? " error" : ""}`; }
    async function request(url, options) {
      const response = await fetch(url, options);
      if (!response.ok) { const body = await response.json().catch(() => ({})); throw new Error(body.detail || "Something went wrong."); }
      return response.status === 204 ? null : response.json();
    }
    async function loadStudents() {
      try { students = await request("/students"); renderMetrics(); renderTable(); } catch (error) { showNotice(error.message, true); }
    }
    function renderMetrics() {
      const total = students.length;
      document.getElementById("total").textContent = total;
      document.getElementById("ai").textContent = students.filter(s => s.course.toLowerCase() === "ai").length;
      document.getElementById("ds").textContent = students.filter(s => s.course.toLowerCase() === "data science").length;
      document.getElementById("average").textContent = total ? (students.reduce((sum, s) => sum + s.age, 0) / total).toFixed(1) : "—";
    }
    function renderTable() {
      const query = document.getElementById("filter").value.toLowerCase();
      const visible = students.filter(s => `${s.name} ${s.course} ${s.email}`.toLowerCase().includes(query));
      document.getElementById("students").innerHTML = visible.length ? visible.map(s => `<tr><td>${s.id}</td><td>${escapeHtml(s.name)}</td><td>${s.age}</td><td>${escapeHtml(s.course)}</td><td>${escapeHtml(s.email)}</td><td><div class="row-actions"><button class="small" onclick="editStudent(${s.id})">Edit</button><button class="small danger" onclick="deleteStudent(${s.id})">Delete</button></div></td></tr>`).join("") : '<tr><td class="empty" colspan="6">No students found.</td></tr>';
    }
    function resetForm() { editingId = null; document.getElementById("student-form").reset(); document.getElementById("id").disabled = false; document.getElementById("form-title").textContent = "Add a student"; document.getElementById("submit").textContent = "Save student"; showNotice(""); document.getElementById("id").focus(); }
    function editStudent(id) { const student = students.find(s => s.id === id); if (!student) return; editingId = id; fields.forEach(field => document.getElementById(field).value = student[field]); document.getElementById("id").disabled = true; document.getElementById("form-title").textContent = `Edit ${student.name}`; document.getElementById("submit").textContent = "Update student"; showNotice(""); window.scrollTo({top: document.getElementById("student-form").getBoundingClientRect().top + scrollY - 24, behavior: "smooth"}); }
    async function deleteStudent(id) { if (!confirm("Delete this student?")) return; try { await request(`/students/${id}`, {method: "DELETE"}); showNotice("Student deleted."); await loadStudents(); if (editingId === id) resetForm(); } catch (error) { showNotice(error.message, true); } }
    document.getElementById("student-form").addEventListener("submit", async event => { event.preventDefault(); const student = Object.fromEntries(fields.map(field => [field, document.getElementById(field).value])); student.id = Number(student.id); student.age = Number(student.age); try { await request(editingId ? `/students/${editingId}` : "/students", {method: editingId ? "PUT" : "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(student)}); showNotice(editingId ? "Student updated." : "Student added."); resetForm(); await loadStudents(); } catch (error) { showNotice(error.message, true); } });
    loadStudents();
  </script>
</body>
</html>
